spring.application.name=NexBell

# Puerto: Render (y otros PaaS) inyectan la variable PORT. En local cae a 8080.
server.port=${PORT:8080}

# Optional local secrets override (gitignored). Put SMTP/mail credentials in
# ./application-local.properties at the repo root; it wins over the values below.
spring.config.import=optional:file:./application-local.properties

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nexora}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
# SQL logging off by default (clean logs, no data leakage). Enable locally with SPRING_JPA_SHOW_SQL=true.
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.use-root-path=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true

# JWT signing secret. MUST be overridden in production via the AUTH_JWT_SECRET
# env var (>= 32 chars for HS256). The fallback below is for local dev only.
authorization.jwt.secret=${AUTH_JWT_SECRET:nexorabackenddevsecretkeynexorabackenddevsecret}
authorization.jwt.expiration-milliseconds=${AUTH_JWT_EXPIRATION_MS:86400000}

# NexBell Edge Service configuration
# The edge service acts as the MQTT-to-REST bridge between the backend and ESP32S3 firmware.
# Update these if the edge service runs on a different host/port.
nexbell.edge-service.host=localhost
nexbell.edge-service.port=3100
mqtt.broker.url=tcp://localhost:1883
mqtt.broker.username=nexbell-esp32
mqtt.broker.password=nexbell-mqtt-2026

# Firebase Cloud Messaging — service account credentials file (gitignored, see .gitignore).
# En local usa el classpath; en producción (Render) sube el JSON como Secret File y
# define FIREBASE_CREDENTIALS_PATH=file:/etc/secrets/firebase-service-account.json
# Si falta el archivo, el push queda deshabilitado pero el backend arranca igual.
firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:classpath:firebase-service-account.json}

# Credential email delivery (onboarding context).
# Disabled by default: the system LOGS the credential email so the flow works
# without SMTP configured. Set nexbell.mail.enabled=true and the spring.mail.*
# values below to send real emails.
nexbell.mail.enabled=${NEXBELL_MAIL_ENABLED:false}
nexbell.mail.from=${NEXBELL_MAIL_FROM:no-reply@nexbell.app}

# Email se envía vía la API HTTP de SendGrid (puerto 443) porque Render (free)
# bloquea SMTP saliente. El remitente debe ser un Single Sender verificado.
sendgrid.api-key=${SENDGRID_API_KEY:}
