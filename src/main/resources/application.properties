spring.application.name=NexoraBackend

spring.datasource.url=jdbc:mysql://localhost:3306/nexora?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=admin
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.use-root-path=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true

authorization.jwt.secret=nexorabackenddevsecretkeynexorabackenddevsecret
authorization.jwt.expiration-milliseconds=86400000

# NexBell Edge Service configuration
# The edge service acts as the MQTT-to-REST bridge between the backend and ESP32S3 firmware.
# Update these if the edge service runs on a different host/port.
nexbell.edge-service.host=localhost
nexbell.edge-service.port=3100
mqtt.broker.url=tcp://localhost:1883
mqtt.broker.username=nexbell-esp32
mqtt.broker.password=nexbell-mqtt-2026

# Firebase Cloud Messaging — service account credentials file (gitignored, see .gitignore)
firebase.credentials-path=classpath:firebase-service-account.json